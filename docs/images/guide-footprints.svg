<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Place buildings on their real footprints</title><desc id="desc">Town Centers and Fortresses occupy nine tiles. Normal buildings occupy four. Walls and resources occupy one. Upright art may extend upward.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9c6b20"/></marker></defs>
<rect width="1200" height="600" fill="#f3f3e7"/>
<g font-family="Arial, sans-serif"><text x="40" y="53" font-size="18" fill="#9c6b20" font-weight="700">ON&#x27;GATE: LEGACY / 0.6.SILKROAD</text><text x="40" y="100" font-size="34" fill="#173d36" font-weight="700">Place buildings on their real footprints</text><text x="55" y="167" font-size="25" fill="#173d36" font-weight="700">3 × 3 = 9 tiles</text><text x="55" y="202" font-size="21" fill="#173d36" font-weight="400">Town Center / Fortress</text><rect x="55" y="230" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="123" y="230" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="191" y="230" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="55" y="298" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="123" y="298" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="191" y="298" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="55" y="366" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="123" y="366" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="191" y="366" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><text x="455" y="167" font-size="25" fill="#173d36" font-weight="700">2 × 2 = 4 tiles</text><text x="455" y="202" font-size="21" fill="#173d36" font-weight="400">House / Farm / Barracks</text><rect x="455" y="230" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="523" y="230" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="591" y="230" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="455" y="298" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="523" y="298" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="591" y="298" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="455" y="366" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="523" y="366" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="591" y="366" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><text x="855" y="167" font-size="25" fill="#173d36" font-weight="700">1 × 1 = 1 tile</text><text x="855" y="202" font-size="21" fill="#173d36" font-weight="400">Wall / resource node</text><rect x="855" y="230" width="64" height="64" fill="#c6dcb7" stroke="#597b59" stroke-width="2"/><rect x="923" y="230" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="991" y="230" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="855" y="298" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="923" y="298" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="991" y="298" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="855" y="366" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="923" y="366" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><rect x="991" y="366" width="64" height="64" fill="#e6e8da" stroke="#597b59" stroke-width="2"/><text x="40" y="490" font-size="23" fill="#173d36" font-weight="700">Green = occupied ground tiles. The grid is shown top-down for clarity.</text><text x="40" y="530" font-size="21" fill="#173d36" font-weight="400">Roofs and tree canopies can rise above the ground footprint. Press G to show the in-game grid.</text><text x="40" y="575" font-size="16" fill="#46645b" font-weight="400">Rules reference: catalog.h, world.cpp, application.cpp and diagnostics.h · 26 October 2026</text></g></svg>