<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Who can see and control what?</title><desc id="desc">Sixteen kingdoms, four full-map spectator seats and one separate operator. Defeated players retain only team vision. Host ownership can coexist with a player or spectator role.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9c6b20"/></marker></defs>
<rect width="1200" height="600" fill="#f3f3e7"/>
<g font-family="Arial, sans-serif"><text x="40" y="53" font-size="18" fill="#9c6b20" font-weight="700">ON&#x27;GATE: LEGACY / 0.6.SILKROAD</text><text x="40" y="100" font-size="34" fill="#173d36" font-weight="700">Who can see and control what?</text><rect x="40" y="150" width="350" height="225" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="40" y="150" width="350" height="7" fill="#9c6b20"/><text x="60" y="193" font-size="24" fill="#173d36" font-weight="700">UP TO 16 KINGDOMS</text><text x="60" y="232" font-size="20" fill="#46645b" font-weight="400">Human players and AI share seats.</text><text x="60" y="261" font-size="20" fill="#46645b" font-weight="400">Own units and issue orders.</text><text x="60" y="290" font-size="20" fill="#46645b" font-weight="400">Allies share explored/current vision.</text><text x="60" y="319" font-size="20" fill="#46645b" font-weight="400">Defeated in play: team vision.</text><rect x="425" y="150" width="350" height="225" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="425" y="150" width="350" height="7" fill="#9c6b20"/><text x="445" y="193" font-size="24" fill="#173d36" font-weight="700">4 SPECTATOR SEATS</text><text x="445" y="232" font-size="20" fill="#46645b" font-weight="400">Additional to the kingdoms.</text><text x="445" y="261" font-size="20" fill="#46645b" font-weight="400">See the full map and economies.</text><text x="445" y="290" font-size="20" fill="#46645b" font-weight="400">Cannot command an army.</text><text x="445" y="319" font-size="20" fill="#46645b" font-weight="400">Share a receive-only stream.</text><rect x="810" y="150" width="350" height="225" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="810" y="150" width="350" height="7" fill="#9c6b20"/><text x="830" y="193" font-size="24" fill="#173d36" font-weight="700">1 DEDICATED OPERATOR</text><text x="830" y="232" font-size="20" fill="#46645b" font-weight="400">Additional to other seats.</text><text x="830" y="261" font-size="20" fill="#46645b" font-weight="400">Configure / start / kick / pause.</text><text x="830" y="290" font-size="20" fill="#46645b" font-weight="400">Not a playable kingdom.</text><text x="830" y="319" font-size="20" fill="#46645b" font-weight="400">May open a separate viewer.</text><text x="40" y="430" font-size="23" fill="#173d36" font-weight="700">Host &amp; Play: the owner occupies a kingdom seat. A spectator host owns a viewer seat.</text><text x="40" y="474" font-size="23" fill="#173d36" font-weight="400">Players and spectators default to 20 Hz snapshots; hosts can tune 5–60 Hz.</text><text x="40" y="515" font-size="21" fill="#173d36" font-weight="400">Host leaves explicitly → the lobby closes for everyone. Guest leaves → only that seat leaves.</text><text x="40" y="575" font-size="16" fill="#46645b" font-weight="400">Rules reference: catalog.h, world.cpp, application.cpp and diagnostics.h · 26 October 2026</text></g></svg>