<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Grow through three ages</title><desc id="desc">Dark to Feudal needs a completed Barracks and resources. Feudal to Castle needs two distinct types from School, Blacksmith and Archery Range. Castle unlocks the Fortress.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9c6b20"/></marker></defs>
<rect width="1200" height="600" fill="#f3f3e7"/>
<g font-family="Arial, sans-serif"><text x="40" y="53" font-size="18" fill="#9c6b20" font-weight="700">ON&#x27;GATE: LEGACY / 0.6.SILKROAD</text><text x="40" y="100" font-size="34" fill="#173d36" font-weight="700">Grow through three ages</text><rect x="40" y="145" width="330" height="230" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="40" y="145" width="330" height="7" fill="#9c6b20"/><text x="60" y="188" font-size="24" fill="#173d36" font-weight="700">1 · DARK AGE</text><text x="60" y="227" font-size="20" fill="#46645b" font-weight="400">Start with a Town Center.</text><text x="60" y="256" font-size="20" fill="#46645b" font-weight="400">Build a Barracks.</text><text x="60" y="285" font-size="20" fill="#46645b" font-weight="400">Save 350 food + 100 gold.</text><text x="60" y="314" font-size="20" fill="#46645b" font-weight="400">Click Advance (any selection).</text><rect x="435" y="145" width="330" height="230" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="435" y="145" width="330" height="7" fill="#9c6b20"/><text x="455" y="188" font-size="24" fill="#173d36" font-weight="700">2 · FEUDAL AGE</text><text x="455" y="227" font-size="20" fill="#46645b" font-weight="400">Complete any TWO kinds:</text><text x="455" y="256" font-size="20" fill="#46645b" font-weight="400">School / Blacksmith / Range.</text><text x="455" y="285" font-size="20" fill="#46645b" font-weight="400">Save 650 food + 150 wood</text><text x="455" y="314" font-size="20" fill="#46645b" font-weight="400">+ 300 gold. Then advance.</text><rect x="830" y="145" width="330" height="230" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="830" y="145" width="330" height="7" fill="#9c6b20"/><text x="850" y="188" font-size="24" fill="#173d36" font-weight="700">3 · CASTLE AGE</text><text x="850" y="227" font-size="20" fill="#46645b" font-weight="400">Build a 3 × 3 Fortress.</text><text x="850" y="256" font-size="20" fill="#46645b" font-weight="400">Train your faction champion.</text><text x="850" y="285" font-size="20" fill="#46645b" font-weight="400">Research second-tier</text><text x="850" y="314" font-size="20" fill="#46645b" font-weight="400">economy and military tech.</text><path d="M378 260 L425 260" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M773 260 L820 260" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="430" font-size="24" fill="#173d36" font-weight="700">Buildings must be completed, alive and owned by you.</text><text x="40" y="468" font-size="22" fill="#173d36" font-weight="400">Two Schools count as one kind. Factions without a Range use School + Blacksmith.</text><text x="40" y="508" font-size="22" fill="#173d36" font-weight="400">Paying the age cost starts research; it does not complete the age instantly.</text><text x="40" y="575" font-size="16" fill="#46645b" font-weight="400">Rules reference: catalog.h, world.cpp, application.cpp and diagnostics.h · 26 October 2026</text></g></svg>