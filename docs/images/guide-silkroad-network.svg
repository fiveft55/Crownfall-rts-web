<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Static browser rooms: who runs the game?</title><desc id="desc">The host browser owns the C++ world. Players send validated commands and receive private snapshots. Spectators receive pushed updates without periodic polling.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9c6b20"/></marker></defs>
<rect width="1200" height="600" fill="#f3f3e7"/>
<g font-family="Arial, sans-serif"><text x="40" y="53" font-size="18" fill="#9c6b20" font-weight="700">ON&#x27;GATE: LEGACY / 0.6.SILKROAD</text><text x="40" y="100" font-size="34" fill="#173d36" font-weight="700">Static browser rooms: who runs the game?</text><rect x="40" y="160" width="340" height="240" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="40" y="160" width="340" height="7" fill="#9c6b20"/><text x="60" y="203" font-size="24" fill="#173d36" font-weight="700">HOST BROWSER TAB</text><text x="60" y="242" font-size="20" fill="#46645b" font-weight="400">WebRTC channel endpoint</text><text x="60" y="271" font-size="20" fill="#46645b" font-weight="400">JavaScript room adapter</text><text x="60" y="300" font-size="20" fill="#46645b" font-weight="400">C++ / WebAssembly worker</text><text x="60" y="329" font-size="20" fill="#46645b" font-weight="400">One authoritative world</text><rect x="460" y="160" width="330" height="240" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="460" y="160" width="330" height="7" fill="#9c6b20"/><text x="480" y="203" font-size="24" fill="#173d36" font-weight="700">PLAYER BROWSER</text><text x="480" y="242" font-size="20" fill="#46645b" font-weight="400">Own seat / private fog</text><text x="480" y="271" font-size="20" fill="#46645b" font-weight="400">Commands → host validation</text><text x="480" y="300" font-size="20" fill="#46645b" font-weight="400">← snapshots at ~20 Hz</text><text x="480" y="329" font-size="20" fill="#46645b" font-weight="400">No Studio/admin access</text><rect x="870" y="160" width="290" height="240" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="870" y="160" width="290" height="7" fill="#9c6b20"/><text x="890" y="203" font-size="24" fill="#173d36" font-weight="700">SPECTATOR</text><text x="890" y="242" font-size="20" fill="#46645b" font-weight="400">Own observer session</text><text x="890" y="271" font-size="20" fill="#46645b" font-weight="400">← pushed snapshots</text><text x="890" y="300" font-size="20" fill="#46645b" font-weight="400">No periodic state polls</text><text x="890" y="329" font-size="20" fill="#46645b" font-weight="400">Team fog after defeat</text><path d="M460 240 L380 240" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M380 320 L460 320" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M380 440 L1010 440" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="505" font-size="21" fill="#173d36" font-weight="400">Private one-use offer/answer exchange. HTTPS / localhost. TURN may be needed.</text><text x="40" y="575" font-size="16" fill="#46645b" font-weight="400">Rules reference: catalog.h, world.cpp, application.cpp and diagnostics.h · 26 October 2026</text></g></svg>