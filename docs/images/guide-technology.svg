<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">One rule engine, two ways to run it</title><desc id="desc">Browser input sends validated commands to C++ rules. Visibility-filtered snapshots become Canvas graphics and Web Audio sound. Windows uses a native server; Web uses the same module as WebAssembly in a worker.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9c6b20"/></marker></defs>
<rect width="1200" height="620" fill="#f3f3e7"/>
<g font-family="Arial, sans-serif"><text x="40" y="53" font-size="18" fill="#9c6b20" font-weight="700">ON&#x27;GATE: LEGACY / 0.6.SILKROAD</text><text x="40" y="100" font-size="34" fill="#173d36" font-weight="700">One rule engine, two ways to run it</text><rect x="40" y="145" width="260" height="200" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="40" y="145" width="260" height="7" fill="#9c6b20"/><text x="60" y="188" font-size="24" fill="#173d36" font-weight="700">INPUT / BROWSER</text><text x="60" y="227" font-size="20" fill="#46645b" font-weight="400">JavaScript + HTML/CSS</text><text x="60" y="256" font-size="20" fill="#46645b" font-weight="400">Mouse / keys / UI</text><text x="60" y="285" font-size="20" fill="#46645b" font-weight="400">Send a small command.</text><rect x="340" y="145" width="260" height="200" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="340" y="145" width="260" height="7" fill="#9c6b20"/><text x="360" y="188" font-size="24" fill="#173d36" font-weight="700">C++ GAME RULES</text><text x="360" y="227" font-size="20" fill="#46645b" font-weight="400">Validate owner and cost.</text><text x="360" y="256" font-size="20" fill="#46645b" font-weight="400">Advance world at 20 Hz.</text><text x="360" y="285" font-size="20" fill="#46645b" font-weight="400">Apply movement/combat.</text><rect x="640" y="145" width="260" height="200" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="640" y="145" width="260" height="7" fill="#9c6b20"/><text x="660" y="188" font-size="24" fill="#173d36" font-weight="700">FILTERED STATE</text><text x="660" y="227" font-size="20" fill="#46645b" font-weight="400">Player: team visibility.</text><text x="660" y="256" font-size="20" fill="#46645b" font-weight="400">Viewer: full or team view.</text><text x="660" y="285" font-size="20" fill="#46645b" font-weight="400">Snapshots default 20 Hz.</text><rect x="940" y="145" width="220" height="200" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="940" y="145" width="220" height="7" fill="#9c6b20"/><text x="960" y="188" font-size="24" fill="#173d36" font-weight="700">PRESENTATION</text><text x="960" y="227" font-size="20" fill="#46645b" font-weight="400">Canvas 2D pixels</text><text x="960" y="256" font-size="20" fill="#46645b" font-weight="400">Web Audio sound</text><text x="960" y="285" font-size="20" fill="#46645b" font-weight="400">Default 60 FPS</text><path d="M305 245 L330 245" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M605 245 L630 245" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M905 245 L930 245" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="395" width="550" height="140" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="40" y="395" width="550" height="7" fill="#9c6b20"/><text x="60" y="438" font-size="24" fill="#173d36" font-weight="700">WINDOWS: NATIVE SERVER</text><text x="60" y="477" font-size="20" fill="#46645b" font-weight="400">C++ owns the world; HTTP carries commands/state.</text><text x="60" y="506" font-size="20" fill="#46645b" font-weight="400">Snapshot workers read while world mutations wait.</text><rect x="625" y="395" width="535" height="140" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="625" y="395" width="535" height="7" fill="#9c6b20"/><text x="645" y="438" font-size="24" fill="#173d36" font-weight="700">WEB DEMO: WEBASSEMBLY WORKER</text><text x="645" y="477" font-size="20" fill="#46645b" font-weight="400">Same C++ game module compiled with Emscripten.</text><text x="645" y="506" font-size="20" fill="#46645b" font-weight="400">Local AI play; no native LAN server in the demo.</text><text x="40" y="595" font-size="16" fill="#46645b" font-weight="400">Rules reference: catalog.h, world.cpp, application.cpp and diagnostics.h · 26 October 2026</text></g></svg>