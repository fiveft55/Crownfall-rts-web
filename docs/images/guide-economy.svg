<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">The economy is a delivery loop</title><desc id="desc">Villagers collect resources, carry them to a completed friendly Town Center and deposit them. Only deposited resources can be spent.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#9c6b20"/></marker></defs>
<rect width="1200" height="600" fill="#f3f3e7"/>
<g font-family="Arial, sans-serif"><text x="40" y="53" font-size="18" fill="#9c6b20" font-weight="700">ON&#x27;GATE: LEGACY / 0.6.SILKROAD</text><text x="40" y="100" font-size="34" fill="#173d36" font-weight="700">The economy is a delivery loop</text><rect x="40" y="155" width="255" height="210" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="40" y="155" width="255" height="7" fill="#9c6b20"/><text x="60" y="198" font-size="24" fill="#173d36" font-weight="700">VILLAGER</text><text x="60" y="237" font-size="20" fill="#46645b" font-weight="400">Right-click a resource.</text><text x="60" y="266" font-size="20" fill="#46645b" font-weight="400">Walk to the node.</text><text x="60" y="295" font-size="20" fill="#46645b" font-weight="400">Collect a carried load.</text><rect x="335" y="155" width="255" height="210" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="335" y="155" width="255" height="7" fill="#9c6b20"/><text x="355" y="198" font-size="24" fill="#173d36" font-weight="700">DELIVERY</text><text x="355" y="237" font-size="20" fill="#46645b" font-weight="400">Return to your</text><text x="355" y="266" font-size="20" fill="#46645b" font-weight="400">completed Town Center.</text><text x="355" y="295" font-size="20" fill="#46645b" font-weight="400">Deposit the load.</text><rect x="630" y="155" width="255" height="210" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="630" y="155" width="255" height="7" fill="#9c6b20"/><text x="650" y="198" font-size="24" fill="#173d36" font-weight="700">STOCKPILE</text><text x="650" y="237" font-size="20" fill="#46645b" font-weight="400">Food / wood</text><text x="650" y="266" font-size="20" fill="#46645b" font-weight="400">Gold / stone</text><text x="650" y="295" font-size="20" fill="#46645b" font-weight="400">Spend after delivery.</text><rect x="925" y="155" width="235" height="210" rx="8" fill="#fffdf6" stroke="#c8d2bf" stroke-width="2"/><rect x="925" y="155" width="235" height="7" fill="#9c6b20"/><text x="945" y="198" font-size="24" fill="#173d36" font-weight="700">INVEST</text><text x="945" y="237" font-size="20" fill="#46645b" font-weight="400">Train / build</text><text x="945" y="266" font-size="20" fill="#46645b" font-weight="400">Repair / research</text><text x="945" y="295" font-size="20" fill="#46645b" font-weight="400">Advance ages</text><path d="M300 260 L325 260" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M595 260 L620 260" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M890 260 L915 260" stroke="#9c6b20" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="425" font-size="24" fill="#173d36" font-weight="700">A full villager is carrying supplies, not extra stockpile resources.</text><text x="40" y="468" font-size="22" fill="#173d36" font-weight="400">Farms provide renewable food. Natural deposits run out. Keep a safe route home.</text><text x="40" y="508" font-size="22" fill="#173d36" font-weight="400">Repairs cost resources: at half the original building cost per full health bar restored.</text><text x="40" y="575" font-size="16" fill="#46645b" font-weight="400">Rules reference: catalog.h, world.cpp, application.cpp and diagnostics.h · 26 October 2026</text></g></svg>